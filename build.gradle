plugins {
    id 'application'
    id 'java'
}

group = 'com.github.cerealklla'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.github.cerealklla.caryvanimager.Main'
}

test {
    useJUnitPlatform()
}

// Same reasoning as BluepryntImager's identical task -- a launch script resolves the real runtime
// classpath once and invokes java directly, instead of going through gradlew.bat's own argument
// re-parsing every time (confirmed there to mangle a --args value with nested quoted paths).
tasks.register('printRuntimeClasspath') {
    dependsOn 'classes'
    doLast {
        println sourceSets.main.runtimeClasspath.asPath
    }
}
